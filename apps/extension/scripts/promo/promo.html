<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TabCabin promo</title>
    <style>
      @font-face {
        font-family: Geist;
        src: url('/font/geist.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: Bricolage;
        src: url('/font/bricolage.woff2') format('woff2');
        font-weight: 200 800;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b100e;
        font-family: Geist, system-ui, sans-serif;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      .layer {
        position: absolute;
        will-change: transform, opacity;
      }
      /* The valley from the website. promo.js sets the colours for the time of day on :root. */
      #bg {
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, var(--sky-top) 8%, var(--sky-bottom) 72%);
      }
      #valley {
        position: absolute;
        inset: 0;
      }
      #valley > svg {
        display: block;
        overflow: visible;
      }
      /* Keeps the captions readable over the valley during the app scenes. */
      #veil {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, var(--veil) 0%, var(--veil) 22%, transparent 52%);
      }
      .chip {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        height: 56px;
        padding: 0 22px 0 12px;
        border-radius: 16px;
        background: #fff;
        color: #0f1110;
        font-size: 21px;
        font-weight: 550;
        white-space: nowrap;
        box-shadow: 0 18px 40px -12px rgb(2 12 8 / 0.55);
      }
      .tile {
        display: flex;
        width: 34px;
        height: 34px;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        color: #fff;
        font-size: 17px;
        font-weight: 700;
      }
      .card {
        position: absolute;
        width: 380px;
        height: 470px;
        border-radius: 28px;
        background: rgb(255 253 248 / 0.62);
        border: 1px solid rgb(31 74 58 / 0.14);
        box-shadow: 0 30px 60px -30px rgb(31 74 58 / 0.35);
      }
      .card-head {
        position: absolute;
        left: 26px;
        top: 22px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 650;
      }
      .card-head span {
        font-size: 34px;
      }
      .big {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-family: Bricolage, Geist, sans-serif;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.02;
      }
      .big.plain {
        font-family: Geist, sans-serif;
        letter-spacing: -0.02em;
      }
      /* Parts of the logo that are drawn one after another in the intro. */
      #build path {
        transform-box: fill-box;
      }
      .word {
        display: inline-block;
        will-change: transform, opacity, filter;
      }
      /* A Chrome window: light by day, dark at night (colours from promo.js). */
      #browser {
        position: absolute;
        left: 560px;
        top: 96px;
        width: 1280px;
        height: 888px;
        border-radius: 16px;
        overflow: hidden;
        background: var(--chrome-frame);
        box-shadow:
          0 60px 120px -30px rgb(2 10 6 / 0.6),
          0 0 0 1px var(--chrome-line);
        transform-origin: 50% 50%;
      }
      .tabstrip {
        position: relative;
        display: flex;
        height: 42px;
        align-items: flex-end;
        padding-left: 16px;
        background: var(--chrome-frame);
      }
      .lights {
        display: flex;
        gap: 8px;
        align-self: center;
        margin-right: 18px;
      }
      .lights i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .tab {
        display: flex;
        width: 250px;
        height: 34px;
        align-items: center;
        gap: 9px;
        padding: 0 12px;
        border-radius: 10px 10px 0 0;
        background: var(--chrome-surface);
        color: var(--chrome-text);
        font-size: 13px;
      }
      .tab-icon {
        display: flex;
        width: 16px;
        height: 16px;
        flex: none;
      }
      .tab-title {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .tab-x,
      .newtab {
        color: var(--chrome-icon);
        font-size: 17px;
      }
      .newtab {
        align-self: center;
        margin-left: 14px;
        font-size: 20px;
      }
      .toolbar {
        display: flex;
        height: 46px;
        align-items: center;
        gap: 16px;
        padding: 0 14px;
        background: var(--chrome-surface);
        border-bottom: 1px solid var(--chrome-line);
        color: var(--chrome-icon);
      }
      .toolbar svg {
        flex: none;
      }
      .omnibox {
        display: flex;
        flex: 1;
        height: 34px;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        border-radius: 17px;
        background: var(--chrome-omnibox);
        color: var(--chrome-text);
        font-size: 14px;
      }
      .omnibox .placeholder {
        color: var(--chrome-icon);
      }
      .ext {
        position: relative;
        display: flex;
        width: 30px;
        height: 30px;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
      }
      .ext .badge {
        position: absolute;
        right: -3px;
        bottom: 0;
        min-width: 15px;
        height: 15px;
        padding: 0 4px;
        border-radius: 8px;
        background: #1f4a3a;
        color: #faf6ee;
        font-size: 10px;
        font-weight: 700;
        line-height: 15px;
        text-align: center;
      }
      .ext .ring {
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px solid #6db592;
      }
      .avatar {
        display: flex;
        width: 26px;
        height: 26px;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: #1f4a3a;
        color: #faf6ee;
        font-size: 13px;
        font-weight: 700;
      }
      .callout {
        position: absolute;
        left: 330px;
        top: 6px;
        display: flex;
        height: 30px;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        border-radius: 15px;
        background: #1f4a3a;
        color: #faf6ee;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        box-shadow: 0 8px 24px -6px rgb(2 12 8 / 0.7);
      }
      #browser .screen {
        position: relative;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: #f2eee5;
      }
      #footage {
        display: block;
        width: 1280px;
        height: 800px;
      }
      #caption {
        position: absolute;
        left: 110px;
        top: 360px;
        width: 400px;
      }
      #caption .kicker {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 0.14em;
        color: var(--accent-ink);
        text-transform: uppercase;
      }
      #caption h2 {
        margin-top: 14px;
        font-family: Bricolage, Geist, sans-serif;
        font-size: 56px;
        line-height: 1.04;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      #caption p {
        margin-top: 18px;
        font-size: 25px;
        line-height: 1.4;
        color: var(--ink-2);
      }
      kbd {
        display: inline-block;
        padding: 0 10px;
        border-radius: 10px;
        background: var(--soft);
        border: 1px solid var(--soft-line);
        font: inherit;
        line-height: 1.2;
      }
      .window {
        position: absolute;
        width: 620px;
        padding: 8px;
        border-radius: 20px;
        background: rgb(244 234 213 / 0.1);
        box-shadow:
          0 40px 90px -24px rgb(2 10 6 / 0.7),
          inset 0 0 0 1px rgb(244 234 213 / 0.22);
      }
      .window img {
        display: block;
        width: 100%;
        border-radius: 12px;
      }
      #server {
        position: absolute;
        left: 880px;
        top: 470px;
        width: 160px;
        height: 160px;
        border-radius: 36px;
        background: #f4ead5;
        box-shadow: 0 30px 70px -20px rgb(2 10 6 / 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .packet {
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #f4ead5;
        box-shadow: 0 0 24px #f4ead5;
      }
      .line {
        position: absolute;
        height: 3px;
        top: 549px;
        background: repeating-linear-gradient(
          90deg,
          rgb(244 234 213 / 0.45) 0 12px,
          transparent 12px 24px
        );
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 14px 26px;
        border-radius: 999px;
        background: var(--soft);
        border: 1px solid var(--soft-line);
        font-size: 24px;
        font-weight: 550;
      }
    </style>
  </head>
  <body>
    <div id="bg"></div>
    <div id="valley"></div>
    <div id="veil"></div>
    <div id="stage"></div>
    <script type="module" src="/promo.js"></script>
  </body>
</html>
