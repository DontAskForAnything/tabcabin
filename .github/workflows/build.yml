# Builds the extension zip and the website with your own addresses. Runs only when started by
# hand (Actions → Build → Run workflow). Set the addresses once under Settings → Secrets and
# variables → Actions → Variables:
#   WXT_SYNC_SERVER  sync server built into the extension, e.g. https://tabs.example.com
#   SITE_URL         public address of the website, e.g. https://example.com
# Both are optional: without WXT_SYNC_SERVER the extension works offline only.
name: Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tabcabin/extension zip
        env:
          WXT_SYNC_SERVER: ${{ vars.WXT_SYNC_SERVER }}
      - run: pnpm --filter @tabcabin/landing build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: apps/extension/.output/*.zip
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: apps/landing/dist
