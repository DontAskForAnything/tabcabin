# Publishes the landing page to GitHub Pages. Runs only when started by hand
# (Actions → Pages → Run workflow) after Pages is enabled in the repository settings.
# The site address comes from the input, or else from the SITE_URL repository variable.
name: Pages

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: Public address of the site (empty = the SITE_URL repository variable)
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @tabcabin/landing...
      - run: pnpm --filter @tabcabin/landing build
        env:
          SITE_URL: ${{ inputs.site_url || vars.SITE_URL }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
