# TabHangar sync server. Quick start (see docs/self-hosting.md):
#   cp .env.example .env   # set DOMAIN and the first account
#   docker compose --profile caddy up -d
services:
  tabhangar:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: tabhangar-server:latest
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN:-tabs.example.com}
      TRUST_PROXY: 'true'
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SIGNUP_EMAILS: ${SIGNUP_EMAILS:-}
      EXTENSION_IDS: ${EXTENSION_IDS:-}
      MAX_USERS: ${MAX_USERS:-0}
      SIGNUPS_PER_IP_PER_DAY: ${SIGNUPS_PER_IP_PER_DAY:-5}
      MAX_RECORDS_PER_USER: ${MAX_RECORDS_PER_USER:-100000}
    volumes:
      - tabhangar-data:/data
    # Only reachable from this machine; Caddy (below or on the host) serves it over HTTPS.
    ports:
      - '127.0.0.1:${TABHANGAR_PORT:-8787}:8787'

  # Optional HTTPS reverse proxy with automatic certificates: `docker compose --profile caddy up -d`
  caddy:
    image: caddy:2
    profiles: [caddy]
    restart: unless-stopped
    depends_on: [tabhangar]
    environment:
      DOMAIN: ${DOMAIN:-tabs.example.com}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  tabhangar-data:
  caddy-data:
  caddy-config:
