<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TabHangar promo</title>
    <style>
      @font-face {
        font-family: Geist;
        src: url('/font/geist.woff2') format('woff2');
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0e0b24;
        font-family: Geist, system-ui, sans-serif;
        color: #fff;
        -webkit-font-smoothing: antialiased;
      }
      .layer {
        position: absolute;
        will-change: transform, opacity;
      }
      #bg {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 120% at 15% 10%, #4b3bd6 0%, #2a1f86 40%, #120d3a 100%);
      }
      #grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgb(255 255 255 / 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgb(255 255 255 / 0.05) 1px, transparent 1px);
        background-size: 64px 64px;
        mask-image: radial-gradient(ellipse 80% 70% at 50% 45%, #000 30%, transparent 100%);
      }
      .orb {
        position: absolute;
        border-radius: 50%;
      }
      .chip {
        position: absolute;
        left: 0;
        top: 0;
        display: flex;
        align-items: center;
        gap: 14px;
        height: 56px;
        padding: 0 22px 0 12px;
        border-radius: 16px;
        background: #fff;
        color: #171a21;
        font-size: 21px;
        font-weight: 550;
        white-space: nowrap;
        box-shadow: 0 18px 40px -12px rgb(10 5 40 / 0.55);
      }
      .tile {
        display: flex;
        width: 34px;
        height: 34px;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        color: #fff;
        font-size: 17px;
        font-weight: 700;
      }
      .card {
        position: absolute;
        width: 380px;
        height: 470px;
        border-radius: 28px;
        background: rgb(255 255 255 / 0.1);
        border: 1px solid rgb(255 255 255 / 0.18);
      }
      .card-head {
        position: absolute;
        left: 26px;
        top: 22px;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 24px;
        font-weight: 650;
      }
      .card-head span {
        font-size: 34px;
      }
      .big {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-weight: 680;
        letter-spacing: -0.04em;
        line-height: 1.02;
      }
      .word {
        display: inline-block;
        will-change: transform, opacity, filter;
      }
      /* A browser window in Chrome's dark theme: it stays calm next to the app's own dialogs
         and matches the dark scene. */
      #browser {
        position: absolute;
        left: 560px;
        top: 96px;
        width: 1280px;
        height: 888px;
        border-radius: 16px;
        overflow: hidden;
        background: #1f2023;
        box-shadow:
          0 60px 120px -30px rgb(5 2 30 / 0.8),
          0 0 0 1px rgb(255 255 255 / 0.14);
        transform-origin: 50% 50%;
      }
      .tabstrip {
        position: relative;
        display: flex;
        height: 42px;
        align-items: flex-end;
        padding-left: 16px;
        background: #1f2023;
      }
      .lights {
        display: flex;
        gap: 8px;
        align-self: center;
        margin-right: 18px;
      }
      .lights i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .tab {
        display: flex;
        width: 250px;
        height: 34px;
        align-items: center;
        gap: 9px;
        padding: 0 12px;
        border-radius: 10px 10px 0 0;
        background: #35363a;
        color: #e8eaed;
        font-size: 13px;
      }
      .tab-icon {
        display: flex;
        width: 16px;
        height: 16px;
        flex: none;
      }
      .tab-title {
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .tab-x,
      .newtab {
        color: #9aa0a6;
        font-size: 17px;
      }
      .newtab {
        align-self: center;
        margin-left: 14px;
        font-size: 20px;
      }
      .toolbar {
        display: flex;
        height: 46px;
        align-items: center;
        gap: 16px;
        padding: 0 14px;
        background: #35363a;
        border-bottom: 1px solid #2a2b2e;
      }
      .toolbar svg {
        flex: none;
      }
      .omnibox {
        display: flex;
        flex: 1;
        height: 34px;
        align-items: center;
        gap: 10px;
        padding: 0 14px;
        border-radius: 17px;
        background: #202124;
        color: #e8eaed;
        font-size: 14px;
      }
      .omnibox .placeholder {
        color: #9aa0a6;
      }
      .ext {
        position: relative;
        display: flex;
        width: 30px;
        height: 30px;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
      }
      .ext .badge {
        position: absolute;
        right: -3px;
        bottom: 0;
        min-width: 15px;
        height: 15px;
        padding: 0 4px;
        border-radius: 8px;
        background: #e5484d;
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        line-height: 15px;
        text-align: center;
      }
      .ext .ring {
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px solid #a99dff;
      }
      .avatar {
        display: flex;
        width: 26px;
        height: 26px;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: #8ab4f8;
        color: #202124;
        font-size: 13px;
        font-weight: 700;
      }
      .callout {
        position: absolute;
        left: 330px;
        top: 6px;
        display: flex;
        height: 30px;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        border-radius: 15px;
        background: #7c6cf6;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        box-shadow: 0 8px 24px -6px rgb(124 108 246 / 0.8);
      }
      #browser .screen {
        position: relative;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: #f6f7f9;
      }
      #footage {
        display: block;
        width: 1280px;
        height: 800px;
      }
      #caption {
        position: absolute;
        left: 110px;
        top: 360px;
        width: 400px;
      }
      #caption .kicker {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 0.14em;
        color: #b9b0ff;
        text-transform: uppercase;
      }
      #caption h2 {
        margin-top: 14px;
        font-size: 54px;
        line-height: 1.04;
        font-weight: 680;
        letter-spacing: -0.035em;
      }
      #caption p {
        margin-top: 18px;
        font-size: 25px;
        line-height: 1.4;
        color: rgb(255 255 255 / 0.75);
      }
      kbd {
        display: inline-block;
        padding: 0 10px;
        border-radius: 10px;
        background: rgb(255 255 255 / 0.16);
        border: 1px solid rgb(255 255 255 / 0.25);
        font: inherit;
        line-height: 1.2;
      }
      .window {
        position: absolute;
        width: 620px;
        padding: 8px;
        border-radius: 20px;
        background: rgb(255 255 255 / 0.1);
        box-shadow:
          0 40px 90px -24px rgb(5 2 30 / 0.7),
          inset 0 0 0 1px rgb(255 255 255 / 0.22);
      }
      .window img {
        display: block;
        width: 100%;
        border-radius: 12px;
      }
      #server {
        position: absolute;
        left: 880px;
        top: 470px;
        width: 160px;
        height: 160px;
        border-radius: 36px;
        background: linear-gradient(145deg, #7f71f2, #5040d6);
        box-shadow: 0 30px 70px -20px rgb(80 64 214 / 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .packet {
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 24px #34d399;
      }
      .line {
        position: absolute;
        height: 3px;
        top: 549px;
        background: repeating-linear-gradient(
          90deg,
          rgb(255 255 255 / 0.45) 0 12px,
          transparent 12px 24px
        );
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 14px 26px;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.12);
        border: 1px solid rgb(255 255 255 / 0.2);
        font-size: 24px;
        font-weight: 550;
      }
    </style>
  </head>
  <body>
    <div id="bg"></div>
    <div id="grid"></div>
    <div id="orbs"></div>
    <div id="stage"></div>
    <script type="module" src="/promo.js"></script>
  </body>
</html>
